<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Alumnos - Sec Mixta 58</title>

  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg-color: #F3F4F6;
      --card-bg: #FFFFFF;
      --text-main: #1F2937;
      --text-muted: #6B7280;
      --border-radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.5;
    }

    /* Encabezado principal */
    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 30px;
      font-size: 1.8rem;
      font-weight: 800;
    }

    /* Contenedor de cada trimestre (Cajas de búsqueda) */
    .search-box {
      background: var(--card-bg);
      padding: 25px;
      margin: 0 auto 30px auto;
      border-radius: var(--border-radius);
      max-width: 700px;
      box-shadow: var(--shadow);
      border-top: 5px solid var(--primary);
    }

    .search-box h2 {
      margin-bottom: 15px;
      font-size: 1.4rem;
      color: var(--text-main);
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input {
      flex: 1;
      padding: 12px 15px;
      font-size: 1rem;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.3s, transform 0.1s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    /* =========================================
       DISEÑO DE LOS RESULTADOS
       ========================================= */
    .result {
      margin-top: 20px;
      animation: fadeIn 0.4s ease-in-out;
    }

    .student-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      border-bottom: 2px solid #E5E7EB;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .observaciones {
      border-left: 5px solid #F59E0B;
      background: #FEF3C7;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      color: #92400E;
    }

    .observaciones h3 {
      font-size: 1rem;
      margin-bottom: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      border: 1px solid #E5E7EB;
      border-radius: var(--border-radius);
      background: #FAFAFA;
      overflow: hidden;
    }

    .card-header {
      background: #F3F4F6;
      padding: 12px 15px;
      font-weight: 700;
      border-bottom: 1px solid #E5E7EB;
      color: #374151;
      text-align: center;
    }

    .card-body {
      padding: 15px;
    }

    .card-body p {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.95rem;
      border-bottom: 1px dashed #E5E7EB;
      padding-bottom: 4px;
    }
    
    .card-body p:last-child {
      border-bottom: none;
    }

    .card-body p span {
      color: var(--text-muted);
    }

    .card-body p b {
      color: var(--text-main);
      text-align: right;
    }

    .card-footer {
      background: #EFF6FF;
      padding: 12px 15px;
      font-weight: 700;
      text-align: center;
      color: #1E3A8A;
      border-top: 1px solid #DBEAFE;
    }

    .status-msg {
      text-align: center;
      font-weight: 600;
      padding: 15px;
      color: var(--text-muted);
    }

    .error-msg {
      color: #DC2626;
      background: #FEE2E2;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsivo para móviles pequeños */
    @media (max-width: 480px) {
      .input-group {
        flex-direction: column;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <h1>Secundaria Mixta 58 - Maestra Erika</h1>

  <!-- ===== 1ER TRIMESTRE ===== -->
  <div class="search-box">
    <h2> 1️⃣ 1er Trimestre</h2>
    <div class="input-group">
      <input type="text" id="codigo1" placeholder="Ej. 1D01TV" onkeypress="verificarEnter(event, 1)">
      <button onclick="buscarAlumno(1)">Buscar</button>
    </div>
    <div id="resultado1"></div>
  </div>

  <!-- ===== 2DO TRIMESTRE ===== -->
  <div class="search-box">
    <h2> 2️⃣ 2do Trimestre</h2>
    <div class="input-group">
      <input type="text" id="codigo2" placeholder="Ej. 1D01TV" onkeypress="verificarEnter(event, 2)">
      <button onclick="buscarAlumno(2)">Buscar</button>
    </div>
    <div id="resultado2"></div>
  </div>

  <!-- ===== 3ER TRIMESTRE ===== -->
  <div class="search-box">
    <h2> 3️⃣ 3er Trimestre</h2>
    <div class="input-group">
      <input type="text" id="codigo3" placeholder="Ej. 1D01TV" onkeypress="verificarEnter(event, 3)">
      <button onclick="buscarAlumno(3)">Buscar</button>
    </div>
    <div id="resultado3"></div>
  </div>

  <script>
    /* =========================================
       CONFIGURACIÓN Y URLS
       ========================================= */
    const trimestresData = {
      1: { url: "https://opensheet.elk.sh/1DSp8qLaJVty5f3zM7ViVkf_CX7UEoHI8h2dtqzWcqf4/concentrado", generador: generarHTML_1er },
      2: { url: "https://opensheet.elk.sh/1LtTVoojUEbXmcDoGkWoXdYP6XFFdjmWagudlwVKA10k/concentrado", generador: generarHTML_2do },
      3: { url: "https://opensheet.elk.sh/1-noHc0-2uh6WYUTi1bVeMr46WZ7wWHa0UXFkgtJBMGo/concentrado", generador: generarHTML_3er }
    };

    /* Función para activar búsqueda con Enter */
    function verificarEnter(event, trimestre) {
      if (event.key === "Enter") {
        buscarAlumno(trimestre);
      }
    }

    /* =========================================
       FUNCIÓN PRINCIPAL DE BÚSQUEDA
       ========================================= */
    async function buscarAlumno(trimestre) {
      const input = document.getElementById(`codigo${trimestre}`);
      const contenedor = document.getElementById(`resultado${trimestre}`);
      const codigo = input.value.trim().toUpperCase();

      if (!codigo) {
        contenedor.innerHTML = `<p class="error-msg">⚠️ Por favor ingresa un código de alumno.</p>`;
        return;
      }

      contenedor.innerHTML = `<p class="status-msg">⏳ Buscando información...</p>`;

      try {
        const config = trimestresData[trimestre];
        const res = await fetch(config.url);
        const data = await res.json();

        // Buscar ignorando espacios extras
        const alumno = data.find(a => (a.CODIGO || "").trim().toUpperCase() === codigo);

        if (!alumno) {
          contenedor.innerHTML = `<p class="error-msg">❌ No se encontró el alumno. Revisa el código e intenta de nuevo.</p>`;
          return;
        }

        // Si existe, genera la tarjeta correspondiente
        contenedor.innerHTML = config.generador(alumno);

      } catch (error) {
        console.error("Error al buscar:", error);
        contenedor.innerHTML = `<p class="error-msg">❌ Ocurrió un error al conectar con la base de datos.</p>`;
      }
    }

    /* =========================================
       PLANTILLAS HTML (GENERADORES)
       ========================================= */
    
    function obtenerObservacion(alumno) {
      return alumno["Observaciones"] || alumno["OBSERVACIONES"] || alumno["Observacion"] || alumno["OBSERVACION"] || "Sin observaciones registradas.";
    }

    /* ----------- 1ER TRIMESTRE ----------- */
    function generarHTML_1er(alumno) {
      return `
        <div class="result">
          <div class="student-name">🧑‍🎓 ${alumno.Nombre || alumno.NOMBRE || ""} (${alumno.CODIGO})</div>
          
          <div class="observaciones">
            <h3>📝 Observaciones (1er Trimestre)</h3>
            <p>${obtenerObservacion(alumno)}</p>
          </div>

          <div class="grid">
            <!-- 1ER CONTENIDO -->
            <div class="card">
              <div class="card-header">1er Contenido</div>
              <div class="card-body">
                <p><span>📋 Trabs. entregados:</span> <b>${alumno["Trabajos entregados 1"] || "-"}</b></p>
                <p><span>🎯 Puntaje Trabajos:</span> <b>${alumno["TAREAS de 80"] || "-"}</b></p>
                <p><span>🛠️ Prácticas:</span> <b>${alumno["Práctica Mujeres en la tecnologia"] || "-"}</b></p>
                <p><span>🚀 Proyectos:</span> <b>${alumno["Proyecto ADIVINA QUE"] || "-"}</b></p>
                <p><span>📝 Fichas:</span> <b>${alumno["FICHAS 1 a 10"] || "-"}</b></p>
              </div>
              <div class="card-footer">
                Calificación: <span>${alumno["TOTAL DE CALIFICACION C1"] || "-"}</span>
              </div>
            </div>

            <!-- 2DO CONTENIDO -->
            <div class="card">
              <div class="card-header">2do Contenido</div>
              <div class="card-body">
                <p><span>📋 Trabs. entregados:</span> <b>${alumno["Trabajos entregados 2"] || "-"}</b></p>
                <p><span>🎯 Puntaje Trabajos:</span> <b>${alumno["TAREAS de 70"] || "-"}</b></p>
                <p><span>🛠️ Prácticas:</span> <b>${alumno["Practica Bloggif"] || "-"}</b></p>
                <p><span>🚀 Proyectos:</span> <b>${alumno["PROYECTO"] || "-"}</b></p>
                <p><span>📝 Fichas:</span> <b>${alumno["FICHAS 11 a 25"] || "-"}</b></p>
              </div>
              <div class="card-footer">
                Calificación: <span>${alumno["TOTAL DE CALIFICACION C2"] || "-"}</span>
              </div>
            </div>

            <!-- EXAMEN FINAL -->
            <div class="card">
              <div class="card-header" style="background:#FDE68A;">Examen y Total</div>
              <div class="card-body">
                <p><span>✅ Aciertos Examen:</span> <b>${alumno["ACIERTOSE"] || "-"}</b></p>
                <p><span>💯 Valor Examen:</span> <b>${alumno["EXAMEN"] || "-"}</b></p>
              </div>
              <div class="card-footer" style="background:#FEF3C7; color:#B45309; border-top-color:#FDE68A; font-size: 1.1rem;">
                Total Trimestre: <span>${alumno["TOTAL TRIMESTRE"] || "-"}</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

                <p><span>🚀 Proyectos:</span> <b>${alumno["Proyecto EMPRE"] || "-"}</b></p>

              </div>
            </div>

            <div class="card">
              <div class="card-header" style="background:#FDE68A;">Examen y Total</div>
              <div class="card-body">
                <p><span>✅ Aciertos Examen:</span> <b>${alumno["ACIERTOSE"] || "-"}</b></p>
                <p><span>💯 Valor Examen:</span> <b>${alumno["EXAMEN"] || "-"}</b></p>
              </div>
              <div class="card-footer" style="background:#FEF3C7; color:#B45309; border-top-color:#FDE68A; font-size: 1.1rem;">
                Total Trimestre: <span>${alumno["TOTAL TRIMESTRE"] || "-"}</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    /* ----------- 3ER TRIMESTRE ----------- */
    // Nota: Mantuve las llaves que tenías en tu código original para el 3er trimestre,
    // pero agregué el nuevo orden y "Trabajos entregados". Ajusta los nombres de las 
    // columnas si son diferentes en tu Excel final.
    function generarHTML_3er(alumno) {
      return `
        <div class="result">
          <div class="student-name">🧑‍🎓 ${alumno.Nombre || alumno.NOMBRE || ""} (${alumno.CODIGO})</div>

            <h3>📝 Observaciones (3er Trimestre)</h3>
            <p>${obtenerObservacion(alumno)}</p>
          </div>

          <div class="grid">

              <div class="card-body">

            </div>

            <div class="card">

                <p><span>📋 Trabs. entregados:</span> <b>${alumno["Trabajos entregados 2"] || "-"}</b></p>
                <p><span>🎯 Puntaje Trabajos:</span> <b>${alumno["TAREAS de 70 C2"] || "-"}</b></p>
                <p><span>🛠️ Prácticas:</span> <b>${alumno["Pract 5.Sist  Tecn CANVA"] || "-"}</b></p>

                <p><span>🚀 Proyectos:</span> <b>${alumno["Proyecto EMPRE"] || "-"}</b></p>

              </div>

    }
  </script>

</body>
</html>
